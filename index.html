<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>BART Live — real-time Bay Area transit</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <canvas id="map"></canvas>

  <!-- Compact floating map controls -->
  <div id="mapctrls">
    <button id="mc-zoom-in" class="mc" aria-label="Zoom in">+</button>
    <button id="mc-zoom-out" class="mc" aria-label="Zoom out">−</button>
    <button id="mc-reset" class="mc" aria-label="Recenter">⌖</button>
  </div>

  <!-- Shown when the desktop panel is collapsed -->
  <button id="panel-reopen" class="hidden" aria-label="Show panel">
    <span class="brand-mark">◉</span> BART Live
  </button>

  <!-- ONE unified panel: sidebar on desktop, bottom sheet on mobile -->
  <aside id="panel">
    <button id="grip" aria-label="Expand or collapse"></button>

    <header class="panel-head">
      <div class="brand">
        <span class="brand-mark">◉</span>
        <div class="brand-text">
          <strong>BART Live</strong>
          <span id="live-status" class="live-pill">connecting…</span>
        </div>
      </div>
      <button id="panel-collapse" class="icon-btn" aria-label="Collapse panel" title="Collapse">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <!-- segmented control (Plan / Lines) -->
    <div id="seg" class="segmented">
      <button data-tab="plan" class="seg-btn active">Plan a trip</button>
      <button data-tab="lines" class="seg-btn">Lines</button>
    </div>

    <div class="panel-body">
      <!-- PLAN -->
      <section id="view-plan" class="view">
        <div class="field">
          <span class="field-dot dot-a"></span>
          <select id="from-select" aria-label="From station"><option value="">Choose start…</option></select>
        </div>
        <button id="btn-swap" class="swap" title="Swap" aria-label="Swap origin and destination">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M7 4v16M7 4L4 7M7 4l3 3M17 20V4M17 20l3-3M17 20l-3-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="field">
          <span class="field-dot dot-b"></span>
          <select id="to-select" aria-label="To station"><option value="">Choose destination…</option></select>
        </div>
        <div class="plan-actions">
          <button id="btn-route" class="btn-primary">Get directions</button>
          <button id="btn-clear-route" class="btn-ghost">Clear</button>
        </div>
        <p class="hint-text">Tip: tap any station on the map to set it as your start or destination.</p>
        <div id="itinerary"></div>
      </section>

      <!-- LINES -->
      <section id="view-lines" class="view" hidden>
        <p class="hint-text">Tap a line to focus it · tap its dot to hide it.</p>
        <ul id="line-list"></ul>
        <div class="panel-foot">
          <span><b id="stat-stations">0</b> stations · 6 lines</span>
          <a href="https://api.bart.gov" target="_blank" rel="noopener">Live data: BART API</a>
        </div>
      </section>

      <!-- DETAIL (station departures / train info) -->
      <section id="view-detail" class="view" hidden>
        <button id="detail-back" class="back-btn">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Back
        </button>
        <div id="detail-body"></div>
      </section>
    </div>
  </aside>

  <script src="js/bart-data.js"></script>
  <script src="js/network.js"></script>
  <script src="js/geometry.js"></script>
  <script src="js/simulation.js"></script>
  <script src="js/routing.js"></script>
  <script src="js/live.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
